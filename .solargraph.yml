---
include:
- Rakefile
- Gemfile
- "*.gemspec"
- "./**/*.rb"
- "app/**/*.rb"
- "lib/**/*.rb"
exclude:
- spec/**/*
- test/**/*
- vendor/**/*
- ".bundle/**/*"
require: []
domains: []
reporters:
- rubocop
- require_not_found
formatter:
  rubocop:
    cops: safe
    except: []
    only: []
    extra_args: []
type_checker:
  rules: {}
require_paths: []
# plugins: []
plugins:
  - rails
max_files: 5000
